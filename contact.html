<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>About</title>
    <link rel="stylesheet" type="text/css" href="assets/css/reset.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" media="screen" href="assets/css/style.css">
</head>


<body class="bg-white">
        <header class="
            bg-light
            text-white
            w-100
            position-fixed 
            border-bottom
            border-secondary">
                <div class="container">
                    <h1  class="
                        bg-success
                        text-white
                        text-center
                        mb-0
                        p-2
                        float-left
                        ">Daniel Han
                    </h1>
                    <nav class="text-secondary d-inline mt-4 float-right">
                        <a class="text-secondary d-inline pr-4 pl-4 border-right border-secondary" href="./index.html">About</a>
                        <a class="text-secondary d-inline pr-4 pl-4 border-right border-secondary" href="./contact.html">Contact</a>
                        <a class="text-secondary d-inline pl-4 border-secondary" href="./portfolio.html">Portfolio</a>
                    </nav>
                </div>
        </header>

        <div id="main-container" class="container">
            <section class=" border-secondary float-left w-100 border p-5 bg-light mb-5 mt-4">                                
                <h2 class="text-success">Contact</h2>
                <hr>          
                <form id="contact-form">
                    <ul>
                    <li>
                    <label class="mb-0 text-secondary" for="name">Name:</label>
                    <input class="mb-4 w-100 border border-secondary" type="text" name="name" placeholder=" John Doe" required="required">
                    </li>
                    <li>
                    <label class="mb-0 text-secondary" for="email">Email:</label>
                    <input class="mb-4 w-100 border border-secondary" type="email" name="email" placeholder=" username@gmail.com" required="required">
                    </li>
                    <li>
                    <label class="mb-0 text-secondary" for="message">Message:</label>
                    <textarea class="w-100 h-40 border border-secondary" name="message" placeholder=" For Professional Inquiries"></textarea>
                    </li>
                    </ul>
                    <div class="button">
                    <input class="text-white bg-success" type="submit"></div>
                </form>                 
            </section>
    
        </div>
              
        <footer class="bg-secondary text-seconday text-center text-white">
                <div class="container">
                  <p class="mt-2"><small>Copyright &copy;</small></p></div>
        </footer>
    </div>
</body>
</html>
